<div class="container mt-4">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-nowrap">
    <h3 class="mb-0">Internships</h3>
    <button class="btn btn-outline-secondary ms-2" (click)="goBack()">← Back</button>
  </div>

  <!-- SEARCH -->
  <form [formGroup]="filterForm" class="mb-3">
    <div class="row g-2">
      <div class="col-12 col-md-4">
        <input class="form-control" placeholder="Search by company" formControlName="search" />
      </div>
  
      <div class="col-12 col-md-4">
        <input class="form-control" placeholder="Technology (e.g. Angular)" formControlName="tech" />
      </div>
    </div>
  </form>

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Title</th>
          <th>Company</th>
          <th>Technologies</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of paginatedInternships; trackBy: trackById">
          <td>{{ i.title }}</td>
          <td>{{ i.companyName }}</td>
          <td>
            <span
              class="badge bg-primary me-1 mb-1 d-inline-block"
              *ngFor="let t of parseTechnologies(i.technologies)"
            >
              {{ t }}
            </span>
          </td>
          <td>
            <button
              class="btn btn-sm btn-info w-100 w-md-auto"
              [routerLink]="['/internships', i.id]"
            >
              Details
            </button>
          </td>
        </tr>

        <tr *ngIf="paginatedInternships.length === 0">
          <td colspan="4" class="text-center">No internships available</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <nav *ngIf="filteredInternships.length > pageSize" class="mt-3">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="page === 1">
        <a class="page-link" (click)="prevPage()">Previous</a>
      </li>
      <li
        class="page-item"
        *ngFor="let p of [].constructor(totalPages); let idx = index"
        [class.active]="page === idx + 1"
      >
        <a class="page-link" (click)="page = idx + 1; applyPagination()">{{ idx + 1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="page === totalPages">
        <a class="page-link" (click)="nextPage()">Next</a>
      </li>
    </ul>
  </nav>
</div>
