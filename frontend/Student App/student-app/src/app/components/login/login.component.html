<div class="d-flex align-items-center bg-light" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h4 class="fw-bold mb-1">Internship Management System</h4>
              <h6 class="text-muted">Student Login</h6>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                  <input type="text" formControlName="username" class="form-control" required />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                  <input type="password" formControlName="password" class="form-control" required />
                </div>
              </div>

              <div *ngIf="error" class="mb-3">
                <div class="text-danger">{{ error }}</div>
              </div>

              <div class="d-grid mt-3">
                <button class="btn btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
